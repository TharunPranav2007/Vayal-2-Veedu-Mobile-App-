name: vayal2veedu
description: "FarmDirect (Vayal 2 Veedu) — Farmer to Consumer Digital Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking & HTTP
  dio: ^5.4.1

  # Local Secure Storage & Cache
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.2

  # UI Components, Fonts & Assets
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

  # Utilities & Helpers
  image_picker: ^1.1.2
  connectivity_plus: ^5.0.2
  uuid: ^4.3.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
