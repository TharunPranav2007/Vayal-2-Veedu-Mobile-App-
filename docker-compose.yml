version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vayal2veedu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vayal2veedu_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vayal2veedu_backend
    restart: always
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/vayal2veedu_db?schema=public"
      JWT_SECRET: "vayal2veedu_super_secret_jwt_key_2026"
    depends_on:
      - postgres

volumes:
  postgres_data:
